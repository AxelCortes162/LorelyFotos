<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | LorelyFotos</title>

    <link rel="stylesheet" href="CSS/index.css">
    <link rel="stylesheet" href="CSS/contacto.css">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // https://dashboard.emailjs.com/admin/account
            emailjs.init({
              publicKey: "DmK9GUmZIXUpqDple",
            });
        })();
    </script>
    <script type="text/javascript">
        window.onload = function() {

            const form = document.getElementById('contact-form');
            const statusBox = document.getElementById('form-status');

            function showMessage(text, type) {
                statusBox.textContent = text;
                statusBox.className = "status-message " + type + " show";

                // Ocultar después de 3 segundos
                setTimeout(() => {
                    statusBox.classList.remove("show");
                }, 3000);
            }

            form.addEventListener('submit', function(event) {
                event.preventDefault();

                emailjs.sendForm('service_qaqsqyl', 'template_wqelvxn', form)
                    .then(() => {

                        showMessage("¡Mensaje enviado correctamente!", "status-success");

                        // Vaciar formulario
                        form.reset();

                    }, (error) => {

                        showMessage("Error al enviar el mensaje. Inténtalo nuevamente.", "status-error");

                        console.error(error);
                    });
            });
        }
    </script>
</head>

<body>
    
    <!-- HEADER -->
    <header>
        <div class="logo">
            <a href="index.html">
                <img src="Imagenes/logo.png" alt="LorelyFotos" class="img_logo">
            </a>
        </div>
        <nav>
            <a href="index.html#futbol">Fútbol</a>

            <a href="contacto.html" class="cta-contact">Contacto</a>
        </nav>
        <div class="menu-toggle">☰</div>
    </header>

    <div id="form-status" class="status-message"></div>

    <!-- OVERLAY MOVIL -->
    <div class="mobile-overlay"></div>

    <!-- HERO -->
    <section class="contact-hero">
        <h1></h1>
    </section>

    <!-- CONTENIDO FLOTANTE -->
    <section class="contact-container">

        <div class="contact-content-wrapper">

            <!-- FORMULARIO -->
            <div class="contact-form-box">
                <h2>Contacto</h2>

                <form class="contact-form" id="contact-form">
                    <input type="text" name="name" placeholder="Nombre completo" required>
                    <input type="email" name="email" placeholder="Correo electrónico" required>
                    <input type="tel" name="phone" placeholder="Telefono" required>
                    <textarea name="message" placeholder="Escribe tu mensaje..."></textarea>

                    <button type="submit" value="Send">Enviar Mensaje</button>
                </form>
            </div>

            <!-- INFORMACIÓN -->
            <div class="contact-info-box">
                <h3>Información</h3>

                <p><strong>Nombre:</strong> Esmeralda Lorely González Rodríguez</p>
                <p><strong>Teléfono:</strong> 55 2722 6821</p>
                <p><strong>Correo:</strong> loryfotos25@gmail.com</p>
                <p><strong>Ubicación:</strong> CDMX</p>
            </div>

        </div>

        <!-- REDES -->
        <div class="contact-social">
            <p style="margin-bottom: 15px;">O contáctame directamente:</p>
            <a href="https://www.instagram.com/lorelyfotos_sports?igsh=MWMyaW54M3J5a205Mw==" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://wa.me/525527226821?text=¡Hola!%20Me%20gustaría%20pedir%20información" target="_blank"><i class="fab fa-whatsapp"></i></a>
            <a href="mailto:loryfotos25@gmail.com?Subject=Fotografía%20deportiva." target="_blank"><i class="far fa-envelope"></i></a>
        </div>

    </section>

    <!-- FOOTER -->

    <script src="JS/menu.js"></script>
</body>
</html>
